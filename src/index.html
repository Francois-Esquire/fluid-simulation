<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Fluid Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      color: white;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; touch-action: none; }
    .controls { position: fixed; z-index: 1; top: 12px; left: 12px; max-width: calc(100% - 48px); padding: 10px 12px; background: #111c; border-radius: 6px; }
    select { margin-left: 8px; padding: 4px; color: white; background: #222; font: inherit; }
    .notice { margin-top: 8px; font-size: 14px; }
    button { padding: 6px 12px; border: 1px solid #52676d; border-radius: 4px; background: #162a31; color: white; font: inherit; cursor: pointer; }
    button:focus-visible, select:focus-visible { outline: 2px solid #7de5d3; outline-offset: 3px; }
    #particle-controls { margin-top: 12px; }
    #particle-status { display: block; margin-top: 8px; max-width: 380px; font-size: 12px; color: #a4bdc5; }
  </style>
</head>

<body>
  <div class="controls">
    <label for="demo">Demo</label>
    <select id="demo">
      <option value="water-2d">Water 2D</option>
      <option value="smoke">Smoke</option>
      <option value="water-3d">Water 3D (experimental)</option>
    </select>
    <div class="notice" id="notice" aria-live="polite">Drag across the canvas to disturb the fluid.</div>
    <div id="particle-controls" hidden>
      <button id="particle-pause" type="button">Play</button>
      <button id="particle-reset" type="button">Reset</button>
      <button id="particle-zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="particle-zoom-out" type="button" aria-label="Zoom out">−</button>
      <label style="display: block; margin-top: 8px; font-size: 14px;">Solver
        <select id="particle-solver">
          <option value="fluid">Fluid density</option>
          <option value="contacts">Particle contacts</option>
          <option value="off">No particle interaction</option>
        </select>
      </label>
      <label style="display: block; margin-top: 8px; font-size: 14px;"><input id="water-surface" type="checkbox" checked /> Water surface</label>
      <label id="density-controls" style="display: block; margin-top: 8px; font-size: 14px;"><input id="particle-density" type="checkbox" /> Show density</label>
      <div id="density-status" style="margin-top: 8px; font-size: 12px; color: #a4bdc5;"></div>
      <output id="particle-status" aria-live="polite"></output>
    </div>
  </div>
  <script type="module" src="./index.js"></script>
</body>

</html>
